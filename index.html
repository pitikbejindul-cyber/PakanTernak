<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Finance Dashboard - Monitor</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

    <style>
        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        /* Background Gradasi Soft Pastel ala Glassmorphism */
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: linear-gradient(135deg, #e0e7ff 0%, #f3e8ff 50%, #e0f2fe 100%);
            background-attachment: fixed;
            color: #1e293b;
            min-h-screen;
        }

        /* Card Effek Kaca Transparan (Glassmorphism) */
        .card-glass {
            background: rgba(255, 255, 255, 0.65);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.8);
            border-radius: 24px;
            box-shadow: 0 10px 30px -5px rgba(99, 102, 241, 0.08),
                        0 4px 12px -2px rgba(0, 0, 0, 0.03);
        }

        .card-glass-hover {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .card-glass-hover:hover {
            transform: translateY(-2px);
            background: rgba(255, 255, 255, 0.8);
            box-shadow: 0 14px 35px -5px rgba(99, 102, 241, 0.12);
        }

        .fade-in {
            animation: fade .3s ease-out;
        }

        @keyframes fade {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        #timeline {
            max-height: 620px;
            overflow-y: auto;
        }

        #timeline::-webkit-scrollbar {
            width: 6px;
        }

        #timeline::-webkit-scrollbar-thumb {
            background: rgba(199, 210, 254, 0.8);
            border-radius: 999px;
        }
    </style>
</head>

<body class="p-4 md:p-8">

<div class="max-w-5xl mx-auto space-y-6">

    <!-- HEADER SECTION (Glassmorphism) -->
    <div class="card-glass p-8 md:p-12 relative overflow-hidden">
        <!-- Floating Accent Glows -->
        <div class="absolute -top-10 -right-10 w-40 h-40 bg-indigo-300/40 rounded-full blur-2xl"></div>
        <div class="absolute -bottom-10 -left-10 w-40 h-40 bg-purple-300/40 rounded-full blur-2xl"></div>

        <div class="relative z-10 flex flex-col sm:flex-row sm:items-center justify-between gap-4">
            <div>
                <h1 class="text-[28px] sm:text-[42px] md:text-5xl font-extrabold text-slate-800 tracking-tight leading-tight">
                    <span class="inline">Dashboard</span>
                    <span class="inline text-transparent bg-clip-text bg-gradient-to-r from-indigo-600 to-purple-600">Keuangan</span>
                </h1>
                <p class="text-base md:text-lg text-slate-500 mt-2 italic font-medium">
                    Rasio Konversi Pakan.
                </p>
            </div>
            
            <!-- Badge Live Status -->
            <div class="inline-flex items-center gap-2 px-4 py-2 rounded-full bg-white/60 border border-white/80 shadow-sm self-start sm:self-center">
                <span class="w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse"></span>
                <span class="text-xs font-bold text-slate-600 tracking-wide uppercase">Realtime Bot</span>
            </div>
        </div>
    </div>

    <!-- METRICS CARDS SECTION -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
        <!-- Total Pengeluaran (Accent Gradient Glass) -->
        <div class="card-glass p-7 bg-gradient-to-br from-indigo-600/90 to-purple-600/90 text-white border-white/20 shadow-xl shadow-indigo-500/10 relative overflow-hidden">
            <div class="absolute -right-6 -bottom-6 w-32 h-32 bg-white/10 rounded-full blur-xl"></div>
            <p class="text-xs uppercase tracking-widest text-indigo-100 font-bold">
                Total Pengeluaran
            </p>
            <h2 id="totalPengeluaran" class="text-4xl md:text-5xl font-black mt-3 text-white tracking-tight">
                Rp 0
            </h2>
        </div>

        <!-- Jumlah Transaksi (Soft Glass) -->
        <div class="card-glass p-7">
            <p class="text-xs uppercase tracking-widest text-slate-400 font-bold">
                Jumlah Transaksi
            </p>
            <h2 id="jumlahTransaksi" class="text-4xl md:text-5xl font-black mt-3 text-slate-800 tracking-tight">
                0
            </h2>
        </div>
    </div>

    <!-- TRANSACTION TIMELINE CONTAINER -->
    <div class="card-glass overflow-hidden">
        <div class="px-6 py-5 border-b border-white/50 flex justify-between items-center bg-white/40">
            <div>
                <h2 class="font-bold text-slate-700 text-xs uppercase tracking-widest">
                    Riwayat Transaksi
                </h2>
            </div>

            <button
                id="refreshBtn"
                class="text-xs bg-indigo-600/90 hover:bg-indigo-600 active:scale-95 text-white disabled:opacity-50 disabled:pointer-events-none px-6 py-2.5 rounded-full font-bold transition-all shadow-md shadow-indigo-500/20 flex items-center justify-center min-w-[100px]"
            >
                Refresh
            </button>
        </div>

        <div id="timeline" class="p-6 space-y-4">
            <div class="text-center py-12 text-slate-400 animate-pulse italic text-sm">
                Memuat data transaksi...
            </div>
        </div>
    </div>

</div>

<script>
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwIg9vpdaeKtd9rlXQAerlCmRej6w9fpWyaMVCDk5Ux-qyC4UDug5ykXh_VcwGvvx5i/exec";
    const CACHE_KEY = "finance_dashboard_cache_data";

    const totalEl = document.getElementById('totalPengeluaran');
    const jumlahEl = document.getElementById('jumlahTransaksi');
    const timelineEl = document.getElementById('timeline');
    const refreshBtn = document.getElementById('refreshBtn');

    function formatRupiah(num) {
        return new Intl.NumberFormat('id-ID', {
            style: 'currency',
            currency: 'IDR',
            minimumFractionDigits: 0
        }).format(num || 0);
    }

    // Mengubah tanggal database menjadi teks lokal Indonesia
    function formatTanggal(dateString) {
        if (!dateString) return '-';
        const date = new Date(dateString);
        if (isNaN(date.getTime())) return dateString; 
        
        return new Intl.DateTimeFormat('id-ID', {
            day: 'numeric',
            month: 'long',
            year: 'numeric'
        }).format(date);
    }

    // Pewarnaan otomatis badge transaksi berdasarkan kata kunci pada deskripsi
    function getBadgeStyle(deskripsi) {
        const teks = (deskripsi || '').toLowerCase();
        if (teks.includes('makan') || teks.includes('minum') || teks.includes('kopi') || teks.includes('kuliner')) {
            return { bg: 'bg-orange-500/10 text-orange-700 border-orange-200/50', label: 'Kuliner' };
        }
        if (teks.includes('bensin') || teks.includes('ojek') || teks.includes('transport') || teks.includes('gofood') || teks.includes('grab')) {
            return { bg: 'bg-blue-500/10 text-blue-700 border-blue-200/50', label: 'Transport' };
        }
        if (teks.includes('listrik') || teks.includes('air') || teks.includes('wifi') || teks.includes('kos') || teks.includes('pulsa')) {
            return { bg: 'bg-purple-500/10 text-purple-700 border-purple-200/50', label: 'Tagihan' };
        }
        return { bg: 'bg-emerald-500/10 text-emerald-700 border-emerald-200/50', label: 'Pakan' };
    }

    // Pengaman string agar deskripsi super panjang tidak merusak tata letak kartu
    function batasiTeks(teks, batas = 65) {
        if (!teks) return 'Transaksi';
        return teks.length > batas ? teks.substring(0, batas) + '...' : teks;
    }

    // Fungsi pemroses kalkulasi angka & trigger rendering ke HTML
    function prosesDanTampilkanData(data) {
        if (!Array.isArray(data)) return;

        const total = data.reduce((acc, item) => {
            const nilai = parseFloat(item.jumlah) || 0;
            return acc + Math.round(nilai * 100);
        }, 0) / 100;

        totalEl.textContent = formatRupiah(total);
        jumlahEl.textContent = data.length;

        render([...data].reverse());
    }

    async function muatData() {
        if (refreshBtn.disabled) return; 

        try {
            // Aktifkan efek loading pada tombol
            refreshBtn.disabled = true;
            refreshBtn.textContent = "Memuat...";

            const response = await fetch(`${WEB_APP_URL}?action=read`);
            const data = await response.json();

            if (data.error) throw new Error(data.error);

            localStorage.setItem(CACHE_KEY, JSON.stringify(data));
            prosesDanTampilkanData(data);

        } catch (err) {
            console.error(err);

            const dataLokal = localStorage.getItem(CACHE_KEY);
            if (dataLokal) {
                prosesDanTampilkanData(JSON.parse(dataLokal));
                return;
            }

            timelineEl.innerHTML = `
                <div class="text-center py-10">
                    <p class="text-rose-500 font-bold">Data gagal dimuat</p>
                    <p class="text-xs text-slate-400 mt-2">
                        Terjadi kesalahan saat mengambil data server. Periksa koneksi internet Anda.
                    </p>
                </div>
            `;
        } finally {
            // Kembalikan tombol ke kondisi normal setelah selesai data masuk
            refreshBtn.disabled = false;
            refreshBtn.textContent = "Refresh";
        }
    }

    function render(data) {
        if (!data.length) {
            timelineEl.innerHTML = `
                <p class="text-center py-10 text-slate-400 italic">Belum ada transaksi.</p>
            `;
            return;
        }

        timelineEl.innerHTML = data.map(item => {
            const jumlah = parseFloat(item.jumlah) || 0;
            const badge = getBadgeStyle(item.deskripsi);
            const tanggalDiformat = formatTanggal(item.tanggal);
            const deskripsiAman = batasiTeks(item.deskripsi);

            return `
                <div class="card-glass card-glass-hover p-5 fade-in">
                    <div class="flex justify-between items-start gap-4">
                        <div class="min-w-0">
                            <div class="flex items-center gap-2.5 mb-2.5">
                                <span class="text-[10px] px-2.5 py-0.5 rounded-full bg-white/80 text-slate-500 font-bold border border-white">
                                    #${item.id || '0'}
                                </span>
                                <span class="text-[10px] uppercase tracking-wider font-extrabold px-2.5 py-0.5 rounded-full border ${badge.bg}">
                                    ${badge.label}
                                </span>
                            </div>
                            <p class="text-sm md:text-base font-bold text-slate-800 break-words tracking-tight">
                                ${deskripsiAman}
                            </p>
                            <p class="text-[11px] text-slate-400 font-medium mt-1.5">
                                ${tanggalDiformat}
                            </p>
                        </div>
                        <div class="shrink-0 text-right">
                            <p class="text-indigo-600 font-extrabold text-base md:text-xl tracking-tight">
                                ${formatRupiah(jumlah)}
                            </p>
                        </div>
                    </div>
                </div>
            `;
        }).join('');
    }

    refreshBtn.addEventListener('click', muatData);

    window.onload = () => {
        const dataLokal = localStorage.getItem(CACHE_KEY);
        if (dataLokal) {
            try {
                prosesDanTampilkanData(JSON.parse(dataLokal));
            } catch (e) {
                localStorage.removeItem(CACHE_KEY);
            }
        }
        muatData();
    };
</script>

</body>
</html>
