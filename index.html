<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FarmFinance - Digital Livestock Dashboard</title>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Google Fonts: Plus Jakarta Sans -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

    <style>
        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        /* Background Gradasi Natural Modern (Digital Farm Theme) */
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: radial-gradient(circle at 0% 0%, #ecfdf5 0%, #f0fdf4 35%, #f4fce3 100%);
            background-attachment: fixed;
            color: #0f172a;
            min-height: 100vh;
        }

        /* Glassmorphism Card dengan Border Vibrant Accent */
        .card-farm {
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.9);
            border-radius: 24px;
            box-shadow: 0 10px 30px -5px rgba(16, 185, 129, 0.05),
                        0 4px 12px -2px rgba(0, 0, 0, 0.02);
        }

        .card-farm-hover {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .card-farm-hover:hover {
            transform: translateY(-2px);
            background: rgba(255, 255, 255, 0.9);
            box-shadow: 0 16px 35px -5px rgba(16, 185, 129, 0.12);
        }

        .fade-in {
            animation: fade .35s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes fade {
            from {
                opacity: 0;
                transform: translateY(12px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Custom Scrollbar */
        #timeline {
            max-height: 620px;
            overflow-y: auto;
        }

        #timeline::-webkit-scrollbar {
            width: 6px;
        }

        #timeline::-webkit-scrollbar-thumb {
            background: rgba(16, 185, 129, 0.25);
            border-radius: 999px;
        }

        #timeline::-webkit-scrollbar-thumb:hover {
            background: rgba(16, 185, 129, 0.4);
        }
    </style>
</head>

<body class="p-4 sm:p-6 md:p-10">

<div class="max-w-5xl mx-auto space-y-6">

    <!-- HEADER SECTION -->
    <div class="card-farm p-6 sm:p-8 md:p-10 relative overflow-hidden">
        <!-- Accent Orbs (Bio-Green Glow) -->
        <div class="absolute -top-12 -right-12 w-48 h-48 bg-emerald-300/30 rounded-full blur-3xl pointer-events-none"></div>
        <div class="absolute -bottom-12 -left-12 w-48 h-48 bg-amber-200/30 rounded-full blur-3xl pointer-events-none"></div>

        <div class="relative z-10 flex flex-col md:flex-row md:items-center justify-between gap-6">
            <div>
                <!-- Brand Badge -->
                <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-emerald-100/80 border border-emerald-200/60 mb-3">
                    <svg class="w-4 h-4 text-emerald-700" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3.055 11H5a2 2 0 012 2v1a2 2 0 002 2 2 2 0 012 2v2.945M8 3.935V5.5A2.5 2.5 0 0010.5 8h.5a2 2 0 012 2 2 2 0 002 2h1.5a2.5 2.5 0 002.5-2.5V11a2 2 0 012-2h1.065M12 20h.01M16 20h.01M9 20h.01"></path>
                    </svg>
                    <span class="text-xs font-bold text-emerald-800 tracking-wider uppercase">Smart Farm Monitoring</span>
                </div>

                <h1 class="text-3xl sm:text-4xl md:text-5xl font-extrabold text-slate-900 tracking-tight leading-tight">
                    Dashboard <span class="text-transparent bg-clip-text bg-gradient-to-r from-emerald-600 via-teal-600 to-amber-600">Keuangan</span>
                </h1>
                <p class="text-sm sm:text-base text-slate-600 mt-2 font-medium flex items-center gap-2">
                    <span>Rasio Konversi Pakan & Operasional Ternak</span>
                </p>
            </div>
            
            <!-- Realtime Status Indicator -->
            <div class="inline-flex items-center gap-3 px-4 py-2.5 rounded-2xl bg-white/80 border border-emerald-100 shadow-sm self-start md:self-center">
                <span class="relative flex h-3 w-3">
                  <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
                  <span class="relative inline-flex rounded-full h-3 w-3 bg-emerald-500"></span>
                </span>
                <div class="flex flex-col">
                    <span class="text-[10px] uppercase font-bold text-slate-400 tracking-wider">Status Node</span>
                    <span class="text-xs font-bold text-emerald-800">Realtime Bot Active</span>
                </div>
            </div>
        </div>
    </div>

    <!-- METRICS CARDS SECTION -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
        
        <!-- Total Pengeluaran Card -->
        <div class="card-farm p-7 bg-gradient-to-br from-emerald-700 via-teal-700 to-emerald-900 text-white border-emerald-600/30 shadow-xl shadow-emerald-900/10 relative overflow-hidden">
            <div class="absolute -right-8 -bottom-8 w-36 h-36 bg-white/10 rounded-full blur-2xl pointer-events-none"></div>
            
            <div class="flex items-center justify-between">
                <p class="text-xs font-extrabold uppercase tracking-widest text-emerald-200">
                    Total Pengeluaran
                </p>
                <div class="p-2 bg-white/10 rounded-xl backdrop-blur-md">
                    <svg class="w-5 h-5 text-emerald-200" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 9V7a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2m2 4h10a2 2 0 002-2v-6a2 2 0 00-2-2H9a2 2 0 00-2 2v6a2 2 0 002 2zm7-5a2 2 0 11-4 0 2 2 0 014 0z"></path>
                    </svg>
                </div>
            </div>

            <h2 id="totalPengeluaran" class="text-3xl sm:text-4xl md:text-5xl font-black mt-4 text-white tracking-tight">
                Rp 0
            </h2>
            <div class="mt-3 flex items-center gap-2 text-xs text-emerald-100/80">
                <span class="inline-block w-2 h-2 rounded-full bg-amber-400"></span>
                <span>Akumulasi biaya operasional & pakan</span>
            </div>
        </div>

        <!-- Jumlah Transaksi Card -->
        <div class="card-farm p-7 relative overflow-hidden">
            <div class="flex items-center justify-between">
                <p class="text-xs font-extrabold uppercase tracking-widest text-slate-400">
                    Jumlah Transaksi
                </p>
                <div class="p-2 bg-slate-100 rounded-xl">
                    <svg class="w-5 h-5 text-slate-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01"></path>
                    </svg>
                </div>
            </div>

            <h2 id="jumlahTransaksi" class="text-3xl sm:text-4xl md:text-5xl font-black mt-4 text-slate-900 tracking-tight">
                0
            </h2>
            <div class="mt-3 flex items-center gap-2 text-xs text-slate-500">
                <span>Catatan tercatat dalam sistem</span>
            </div>
        </div>
    </div>

    <!-- TRANSACTION TIMELINE CONTAINER -->
    <div class="card-farm overflow-hidden">
        <!-- Timeline Header -->
        <div class="px-6 py-5 border-b border-slate-200/60 flex justify-between items-center bg-white/50">
            <div class="flex items-center gap-3">
                <div class="w-2.5 h-6 bg-emerald-500 rounded-full"></div>
                <h2 class="font-bold text-slate-800 text-xs sm:text-sm uppercase tracking-wider">
                    Riwayat Transaksi Peternakan
                </h2>
            </div>

            <button
                id="refreshBtn"
                class="text-xs bg-emerald-600 hover:bg-emerald-700 active:scale-95 text-white disabled:opacity-50 disabled:pointer-events-none px-6 py-2.5 rounded-xl font-bold transition-all shadow-md shadow-emerald-600/20 flex items-center justify-center gap-2 min-w-[110px]"
            >
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path>
                </svg>
                <span>Refresh</span>
            </button>
        </div>

        <!-- Timeline List Container -->
        <div id="timeline" class="p-6 space-y-4">
            <div class="text-center py-12 text-slate-400 animate-pulse italic text-sm flex flex-col items-center justify-center gap-2">
                <svg class="w-8 h-8 text-emerald-500 animate-spin" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
                <span>Memuat data transaksi peternakan...</span>
            </div>
        </div>
    </div>

</div>

<script>
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwIg9vpdaeKtd9rlXQAerlCmRej6w9fpWyaMVCDk5Ux-qyC4UDug5ykXh_VcwGvvx5i/exec";
    const CACHE_KEY = "finance_dashboard_cache_data";

    const totalEl = document.getElementById('totalPengeluaran');
    const jumlahEl = document.getElementById('jumlahTransaksi');
    const timelineEl = document.getElementById('timeline');
    const refreshBtn = document.getElementById('refreshBtn');

    function formatRupiah(num) {
        return new Intl.NumberFormat('id-ID', {
            style: 'currency',
            currency: 'IDR',
            minimumFractionDigits: 0
        }).format(num || 0);
    }

    // Mengubah tanggal database menjadi teks lokal Indonesia
    function formatTanggal(dateString) {
        if (!dateString) return '-';
        const date = new Date(dateString);
        if (isNaN(date.getTime())) return dateString; 
        
        return new Intl.DateTimeFormat('id-ID', {
            day: 'numeric',
            month: 'long',
            year: 'numeric'
        }).format(date);
    }

    // Pewarnaan otomatis badge transaksi berbasis nuansa peternakan & operasional
    function getBadgeStyle(deskripsi) {
        const teks = (deskripsi || '').toLowerCase();
        if (teks.includes('makan') || teks.includes('minum') || teks.includes('kopi') || teks.includes('kuliner')) {
            return { bg: 'bg-amber-500/10 text-amber-800 border-amber-300/50', label: 'Kuliner' };
        }
        if (teks.includes('bensin') || teks.includes('ojek') || teks.includes('transport') || teks.includes('gofood') || teks.includes('grab')) {
            return { bg: 'bg-sky-500/10 text-sky-800 border-sky-300/50', label: 'Transport' };
        }
        if (teks.includes('listrik') || teks.includes('air') || teks.includes('wifi') || teks.includes('kos') || teks.includes('pulsa')) {
            return { bg: 'bg-indigo-500/10 text-indigo-800 border-indigo-300/50', label: 'Tagihan' };
        }
        // Default kategori pakan / operasional ternak
        return { bg: 'bg-emerald-500/10 text-emerald-800 border-emerald-300/50', label: 'Pakan & Ternak' };
    }

    // Pengaman string agar deskripsi super panjang tidak merusak tata letak kartu
    function batasiTeks(teks, batas = 65) {
        if (!teks) return 'Transaksi';
        return teks.length > batas ? teks.substring(0, batas) + '...' : teks;
    }

    // Fungsi pemroses kalkulasi angka & trigger rendering ke HTML
    function prosesDanTampilkanData(data) {
        if (!Array.isArray(data)) return;

        const total = data.reduce((acc, item) => {
            const nilai = parseFloat(item.jumlah) || 0;
            return acc + Math.round(nilai * 100);
        }, 0) / 100;

        totalEl.textContent = formatRupiah(total);
        jumlahEl.textContent = data.length;

        render([...data].reverse());
    }

    async function muatData() {
        if (refreshBtn.disabled) return; 

        try {
            // Aktifkan efek loading pada tombol
            refreshBtn.disabled = true;
            refreshBtn.textContent = "Memuat...";

            const response = await fetch(`${WEB_APP_URL}?action=read`);
            const data = await response.json();

            if (data.error) throw new Error(data.error);

            localStorage.setItem(CACHE_KEY, JSON.stringify(data));
            prosesDanTampilkanData(data);

        } catch (err) {
            console.error(err);

            const dataLokal = localStorage.getItem(CACHE_KEY);
            if (dataLokal) {
                prosesDanTampilkanData(JSON.parse(dataLokal));
                return;
            }

            timelineEl.innerHTML = `
                <div class="text-center py-10">
                    <p class="text-rose-600 font-bold">Data gagal dimuat</p>
                    <p class="text-xs text-slate-400 mt-1">
                        Terjadi kesalahan saat mengambil data server. Periksa koneksi internet Anda.
                    </p>
                </div>
            `;
        } finally {
            // Kembalikan tombol ke kondisi normal setelah selesai data masuk
            refreshBtn.disabled = false;
            refreshBtn.textContent = "Refresh";
        }
    }

    function render(data) {
        if (!data.length) {
            timelineEl.innerHTML = `
                <p class="text-center py-10 text-slate-400 italic">Belum ada transaksi tercatat.</p>
            `;
            return;
        }

        timelineEl.innerHTML = data.map(item => {
            const jumlah = parseFloat(item.jumlah) || 0;
            const badge = getBadgeStyle(item.deskripsi);
            const tanggalDiformat = formatTanggal(item.tanggal);
            const deskripsiAman = batasiTeks(item.deskripsi);

            return `
                <div class="card-farm card-farm-hover p-5 fade-in">
                    <div class="flex justify-between items-start gap-4">
                        <div class="min-w-0">
                            <div class="flex items-center gap-2 mb-2">
                                <span class="text-[10px] px-2.5 py-0.5 rounded-md bg-slate-100 text-slate-600 font-bold border border-slate-200">
                                    #${item.id || '0'}
                                </span>
                                <span class="text-[10px] uppercase tracking-wider font-extrabold px-2.5 py-0.5 rounded-md border ${badge.bg}">
                                    ${badge.label}
                                </span>
                            </div>
                            <p class="text-sm md:text-base font-bold text-slate-800 break-words tracking-tight">
                                ${deskripsiAman}
                            </p>
                            <p class="text-[11px] text-slate-400 font-medium mt-1">
                                ${tanggalDiformat}
                            </p>
                        </div>
                        <div class="shrink-0 text-right">
                            <p class="text-emerald-700 font-extrabold text-base md:text-xl tracking-tight">
                                ${formatRupiah(jumlah)}
                            </p>
                        </div>
                    </div>
                </div>
            `;
        }).join('');
    }

    refreshBtn.addEventListener('click', muatData);

    window.onload = () => {
        const dataLokal = localStorage.getItem(CACHE_KEY);
        if (dataLokal) {
            try {
                prosesDanTampilkanData(JSON.parse(dataLokal));
            } catch (e) {
                localStorage.removeItem(CACHE_KEY);
            }
        }
        muatData();
    };
</script>

</body>
</html>
